name: Native Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install generator prerequisites
        run: sudo apt-get update && sudo apt-get install -y bison flex ed
      - name: Download verified source bundle
        shell: bash
        run: |
          mkdir -p out/downloads
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://downloads.kergis.com/kertex/kertex_bundle.tar \
            --output out/downloads/kertex_bundle.tar
          echo 'b87408cc963be3b013be588935861771c7acca011becf2888fa9629c1b97b3b4  out/downloads/kertex_bundle.tar' | sha256sum --check
      - name: Generate C sources
        shell: bash
        run: sh tools/generate-kertex-sources.sh out/downloads/kertex_bundle.tar "$PWD" out/generated
      - uses: actions/upload-artifact@v4
        with:
          name: kertex-generated-c
          path: out/generated
          if-no-files-found: error

  build:
    needs: generate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: kertex-generated-c
          path: out/generated

      - name: Install WPM
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'wpm-install.cmd'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/Thewafflication/wpm/releases/latest/download/install.cmd' -OutFile $installer
          & $installer
          'C:\Program Files\WPM' | Add-Content -Path $env:GITHUB_PATH

      - name: Trust package repositories
        shell: powershell
        run: |
          $keys = @(
            'https://github.com/Thewafflication/tcc_package/releases/latest/download/wpm-release.public',
            'https://github.com/Thewafflication/wcrt/releases/latest/download/wpm-release.public'
          )
          foreach ($url in $keys) {
            $key = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            Invoke-WebRequest -UseBasicParsing $url -OutFile $key
            wpm trust add $key
          }
          wpm repo add https://github.com/Thewafflication/tcc_package/releases/latest/download
          wpm repo add https://github.com/Thewafflication/wcrt/releases/latest/download
          wpm config set prerelease true --package tinycc
          if ($LASTEXITCODE -ne 0) { throw 'WPM failed to enable TinyCC prereleases' }
          wpm update
          if ($LASTEXITCODE -ne 0) { throw 'WPM failed to update package indexes' }

      - name: Install TinyCC and WCRT
        shell: powershell
        run: |
          wpm install tinycc --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'WPM failed to install TinyCC' }
          wpm install wcrt --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'WPM failed to install WCRT' }

      - name: Locate build tools
        shell: powershell
        run: |
          $driver = @{
            x86 = 'i386-win32-tcc.exe'
            x64 = 'x86_64-win32-tcc.exe'
            arm64 = 'arm64-win32-tcc.exe'
          }['${{ matrix.arch }}']
          $tinyCc = Get-ChildItem "$env:ProgramFiles\TinyCC" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName $driver) } |
            Select-Object -First 1
          if (-not $tinyCc) {
            Get-ChildItem "$env:ProgramFiles\TinyCC" -Recurse -ErrorAction SilentlyContinue
            throw "The WPM TinyCC package does not contain $driver"
          }
          $minimumWcrtVersion = [version]'0.9.4'
          $wcrt = Get-ChildItem "$env:ProgramFiles\WCRT" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Where-Object {
              $parsedVersion = $null
              $versionText = ($_.Name -split '[+-]')[0]
              $versionIsSupported = [version]::TryParse($versionText, [ref]$parsedVersion) -and
                $parsedVersion -ge $minimumWcrtVersion
              $versionIsSupported -and
              (Test-Path (Join-Path $_.FullName 'lib\libwcrt.a')) -and
              (Test-Path (Join-Path $_.FullName 'lib\wcrt-startup-console.o')) -and
              (Test-Path (Join-Path $_.FullName 'include\stdio.h'))
            } |
            Select-Object -First 1
          if (-not $wcrt) {
            Get-ChildItem "$env:ProgramFiles\WCRT" -Recurse -ErrorAction SilentlyContinue
            throw 'WCRT 0.9.4+ with libwcrt.a, headers, and the console startup object is required'
          }
          "WPM_TCC_ROOT=$($tinyCc.FullName)" | Add-Content -Path $env:GITHUB_ENV
          "WPM_WCRT_ROOT=$($wcrt.FullName)" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "TinyCC: $($tinyCc.FullName)\$driver"
          Write-Host "WCRT: $($wcrt.FullName)"

          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey failed to install Ninja' }
          }

      - name: Resolve product version
        shell: powershell
        run: |
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $sourceVersion = Get-Content kertex_T/CID |
              Where-Object { $_ -match '^VERSION:\s*([0-9]+\.[0-9]+\.[0-9]+)' } |
              Select-Object -First 1
            if (-not $sourceVersion -or $sourceVersion -notmatch '^VERSION:\s*([0-9]+\.[0-9]+\.[0-9]+)') {
              throw 'Could not derive the package version from kertex_T/CID'
            }
            $baseVersion = $Matches[1]
            $revision = '${{ github.sha }}'.Substring(0, 8)
            $version = "$baseVersion-ci.${{ github.run_number }}.${{ github.run_attempt }}+$revision"
          }
          "KERTEX_PACKAGE_VERSION=$version" | Add-Content -Path $env:GITHUB_ENV
          Write-Host "kerTeX product/package version: $version"

      - name: Configure and build
        shell: powershell
        run: |
          cmake --preset ${{ matrix.arch }}-release -DKERTEX_PACKAGE_VERSION=$env:KERTEX_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build --preset build-${{ matrix.arch }}-release
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          cmake --install out/build/${{ matrix.arch }}-release
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }

      - name: Verify native PE files
        shell: powershell
        run: |
          Get-ChildItem out/install/${{ matrix.arch }}-release/bin/*.exe | ForEach-Object {
            ./tools/Verify-Pe.ps1 -Path $_.FullName -Architecture ${{ matrix.arch }}
          }

      - name: Prepare WPM release signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          WPM_PRIVATE_KEY: ${{ secrets.WPM_RELEASE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WPM_PRIVATE_KEY)) {
            throw 'Tagged releases require the WPM_RELEASE_PRIVATE_KEY secret'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'kertex-release.private'
          Set-Content -LiteralPath $keyPath -Value $env:WPM_PRIVATE_KEY -Encoding utf8NoBOM
          "KERTEX_WPM_SIGNING_KEY=$keyPath" | Add-Content -Path $env:GITHUB_ENV

      - name: Build WPM package
        shell: powershell
        run: |
          $arguments = @('-Architecture', '${{ matrix.arch }}', '-Version', $env:KERTEX_PACKAGE_VERSION)
          if ($env:KERTEX_WPM_SIGNING_KEY) {
            $arguments += @('-SigningKey', $env:KERTEX_WPM_SIGNING_KEY)
          }
          ./tools/Build-WpmPackage.ps1 @arguments

      - name: Remove WPM release signing key
        if: always() && startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'kertex-release.private') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: kertex-windows-${{ matrix.arch }}
          path: out/install/${{ matrix.arch }}-release
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kertex-wpm-${{ matrix.arch }}
          path: out/packages/kertex-${{ matrix.arch }}-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish GitHub release
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kertex-wpm-*
          path: release-assets
          merge-multiple: true

      - name: Create WPM package manifest
        shell: powershell
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag is not semantic: $tag"
          }
          $assets = (Resolve-Path release-assets).Path
          Copy-Item release_keys/wpm-release.public (Join-Path $assets 'wpm-release.public')
          $packages = foreach ($file in Get-ChildItem $assets -Filter 'kertex-*.zip' -File) {
            if ($file.Name -notmatch '^kertex-(x86|x64|arm64)-(.+)\.zip$') {
              throw "Unexpected package filename: $($file.Name)"
            }
            [ordered]@{
              name = 'kertex'
              version = $Matches[2]
              arch = $Matches[1]
              url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($file.Name)"
            }
          }
          if (@($packages).Count -ne 3) { throw 'Expected exactly three KerTeX WPM packages.' }
          [ordered]@{ version = 1; packages = @($packages) } |
            ConvertTo-Json -Depth 4 |
            Set-Content (Join-Path $assets 'index.json') -Encoding utf8NoBOM

      - name: Generate release checksums
        shell: powershell
        run: |
          $assets = (Resolve-Path release-assets).Path
          Get-ChildItem $assets -File |
            Sort-Object Name |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content (Join-Path $assets 'SHA256SUMS') -Encoding ascii

      - name: Create release and upload assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem release-assets -File)
          gh release upload $tag --repo '${{ github.repository }}' --clobber @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
